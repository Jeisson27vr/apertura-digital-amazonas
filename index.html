<script>
        function abrirModal() { document.getElementById('modal_politica').style.display = 'flex'; }
        function cerrarModal() { document.getElementById('modal_politica').style.display = 'none'; }

        // Algoritmo Ecuatoriano Módulo 10
        function validarCedulaEcuatoriana(cedula) {
            if (cedula.length !== 10 || isNaN(cedula)) return false;
            var prov = parseInt(cedula.substring(0, 2), 10);
            if (prov < 1 || prov > 24) return false;
            var tercerDigito = parseInt(cedula.substring(2, 3), 10);
            if (tercerDigito >= 6) return false;

            var suma = 0;
            for (var i = 0; i < 9; i++) {
                var digito = parseInt(cedula.charAt(i), 10);
                if (i % 2 === 0) {
                    digito *= 2;
                    if (digito > 9) digito -= 9;
                }
                suma += digito;
            }
            var digitoVerificador = parseInt(cedula.charAt(9), 10);
            var decenaSuperior = Math.ceil(suma / 10) * 10;
            var verificadorCalculado = decenaSuperior - suma;
            if (verificadorCalculado === 10) verificadorCalculado = 0;

            return verificadorCalculado === digitoVerificador;
        }

        function procesarEscaneo() {
            var nombres = document.getElementById('nombres_cliente').value.trim();
            var cedula = document.getElementById('cedula_cliente').value.trim();
            var aceptaTerminos = document.getElementById('check_terminos').checked;
            var boton = document.getElementById('btn_continuar');

            if(nombres.length < 3) { alert("Por favor ingresa tus nombres completos."); return; }
            if(!validarCedulaEcuatoriana(cedula)) { alert("❌ La cédula ingresada no es válida. Revisa los números."); return; }
            if(!aceptaTerminos) { alert("Debes aceptar la política de tratamiento de datos para continuar."); return; }

            boton.innerText = "Procesando...";
            boton.disabled = true;

            var parametrosURL = new URLSearchParams(window.location.search);
            var idColaborador = parametrosURL.get('oficial') || 'ORGANICO';

            // RECUERDA: Mantén aquí tu URL real de Google Apps Script
            var webhookUrl = "https://script.google.com/macros/s/AKfycbxWv-cvVkoeD-3z-MOBqT4ZvCW1SgBEmtiu5p8K-On9HIIJP4Qu2wSr3W6p4nt64GKWHA/exec";

            fetch(webhookUrl, {
                method: 'POST',
                mode: 'no-cors',
                body: JSON.stringify({
                    "nombres": nombres,
                    "cedula": cedula,
                    "oficial": idColaborador,
                    "acepta_politica": "SI"
                }),
                headers: { "Content-Type": "text/plain" }
            })
            .then(() => { redireccionarTienda(); })
            .catch(() => { redireccionarTienda(); });
        }

        function redireccionarTienda() {
            var userAgent = navigator.userAgent || navigator.vendor || window.opera;
            if (/iPad|iPhone|iPod/.test(userAgent) && !window.MSStream) {
                window.location.href = "https://apps.apple.com/us/app/banco-amazonas-s-a/id1277855928?uo=4";
            } else if (/android/i.test(userAgent)) {
                window.location.href = "https://play.google.com/store/apps/details?id=com.amazonas.mobile";
            } else {
                window.location.href = "https://www.bancoamazonas.com/canales-digitales";
            }
        }
    </script>
